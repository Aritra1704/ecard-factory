<!doctype html>
<html lang="en" class="h-full bg-slate-950">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>eCard Factory - Model Comparison</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              panel: "#0b1730",
              panelSoft: "#0f1f3d",
              line: "#1e3a5f",
              accent: "#22d3ee",
              success: "#34d399",
              danger: "#f87171",
              gold: "#f59e0b",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-full bg-slate-950 text-slate-100">
    <main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
      <header class="mb-8">
        <p class="text-sm uppercase tracking-[0.3em] text-cyan-400">Comparison Console</p>
        <h1 class="mt-3 text-3xl font-semibold tracking-tight text-white sm:text-4xl">
          eCard Factory - Model Comparison
        </h1>
        <p class="mt-3 max-w-3xl text-sm text-slate-400 sm:text-base">
          Compare the same phrase prompt across all configured backends.
        </p>
      </header>

      <section class="rounded-3xl border border-line bg-panel p-5 shadow-2xl shadow-cyan-950/20 sm:p-6">
        <div class="grid gap-6 lg:grid-cols-[65%_35%]">
          <aside class="lg:order-2">
            <label class="block">
              <span class="mb-2 block text-sm font-medium text-slate-200">Import Theme JSON</span>
              <textarea
                id="jsonImportInput"
                rows="15"
                class="w-full rounded-2xl border border-line bg-slate-950 px-4 py-3 font-mono text-sm text-slate-100 outline-none transition focus:border-accent"
                placeholder='{
  "theme_name": "Diwali Wishes",
  "tone_funny_pct": 5,
  "tone_emotion_pct": 95,
  "prompt_keywords": ["light", "diyas", "family", "home"],
  "visual_style": "warm golden photography",
  "audience": "general Indian family",
  "count": 3,
  "max_words": 15,
  "emoji_policy": "none",
  "tone_style": "conversational",
  "avoid_cliches": true
}'
              ></textarea>
            </label>
            <div class="mt-4">
              <button
                id="populateFieldsButton"
                type="button"
                class="rounded-xl bg-cyan-500 px-4 py-2 text-sm font-semibold text-slate-950 transition hover:bg-cyan-400"
              >
                &larr; Populate Fields
              </button>
              <p id="importStatus" class="mt-2 text-sm text-slate-400"></p>
            </div>
          </aside>

          <div class="lg:order-1">
            <div class="space-y-4">
              <div class="grid gap-3 md:grid-cols-4">
                <label class="block">
                  <span class="mb-1 block text-xs font-medium text-slate-300">Theme Name</span>
                  <input
                    id="themeName"
                    type="text"
                    value="Motivational Monday"
                    class="w-full rounded-xl border border-line bg-slate-950 px-3 py-2 text-sm text-white outline-none transition focus:border-accent"
                  />
                </label>
                <label class="block">
                  <span class="mb-1 block text-xs font-medium text-slate-300">Keywords (comma separated)</span>
                  <input
                    id="keywords"
                    type="text"
                    value="strength, monday, energy"
                    class="w-full rounded-xl border border-line bg-slate-950 px-3 py-2 text-sm text-white outline-none transition focus:border-accent"
                  />
                </label>
                <label class="block">
                  <span class="mb-1 block text-xs font-medium text-slate-300">Funny %</span>
                  <input
                    id="funnyPct"
                    type="number"
                    min="0"
                    max="100"
                    value="30"
                    class="w-full rounded-xl border border-line bg-slate-950 px-3 py-2 text-sm text-white outline-none transition focus:border-accent"
                  />
                </label>
                <label class="block">
                  <span class="mb-1 block text-xs font-medium text-slate-300">Emotion %</span>
                  <input
                    id="emotionPct"
                    type="number"
                    min="0"
                    max="100"
                    value="70"
                    class="w-full rounded-xl border border-line bg-slate-950 px-3 py-2 text-sm text-white outline-none transition focus:border-accent"
                  />
                </label>
              </div>

              <div class="grid gap-3 md:grid-cols-4">
                <label class="block">
                  <span class="mb-1 block text-xs font-medium text-slate-300">Visual Style</span>
                  <input
                    id="visualStyle"
                    type="text"
                    value="warm photography"
                    class="w-full rounded-xl border border-line bg-slate-950 px-3 py-2 text-sm text-white outline-none transition focus:border-accent"
                  />
                </label>
                <label class="block">
                  <span class="mb-1 block text-xs font-medium text-slate-300">Audience</span>
                  <input
                    id="audience"
                    type="text"
                    value="general"
                    class="w-full rounded-xl border border-line bg-slate-950 px-3 py-2 text-sm text-white outline-none transition focus:border-accent"
                  />
                </label>
                <label class="block">
                  <span class="mb-1 block text-xs font-medium text-slate-300">Count</span>
                  <input
                    id="count"
                    type="number"
                    min="1"
                    value="3"
                    class="w-full rounded-xl border border-line bg-slate-950 px-3 py-2 text-sm text-white outline-none transition focus:border-accent"
                  />
                </label>
                <label class="block">
                  <span class="mb-1 block text-xs font-medium text-slate-300">Max Words</span>
                  <input
                    id="maxWords"
                    type="number"
                    min="1"
                    value="16"
                    class="w-full rounded-xl border border-line bg-slate-950 px-3 py-2 text-sm text-white outline-none transition focus:border-accent"
                  />
                </label>
              </div>

              <div class="grid gap-3 md:grid-cols-4">
                <label class="block">
                  <span class="mb-1 block text-xs font-medium text-slate-300">Emoji Policy</span>
                  <select
                    id="emojiPolicy"
                    class="w-full rounded-xl border border-line bg-slate-950 px-3 py-2 text-sm text-white outline-none transition focus:border-accent"
                  >
                    <option value="none" selected>none</option>
                    <option value="allowed">allowed</option>
                    <option value="required">required</option>
                  </select>
                </label>
                <label class="block">
                  <span class="mb-1 block text-xs font-medium text-slate-300">Tone Style</span>
                  <select
                    id="toneStyle"
                    class="w-full rounded-xl border border-line bg-slate-950 px-3 py-2 text-sm text-white outline-none transition focus:border-accent"
                  >
                    <option value="conversational" selected>conversational</option>
                    <option value="poetic">poetic</option>
                    <option value="formal">formal</option>
                    <option value="playful">playful</option>
                  </select>
                </label>
                <label
                  class="flex h-full items-center gap-2 rounded-xl border border-line bg-slate-950 px-3 py-2 text-sm text-slate-100"
                >
                  <input
                    id="avoidCliches"
                    type="checkbox"
                    checked
                    class="h-4 w-4 rounded border-slate-600 bg-slate-900 text-cyan-400 focus:ring-cyan-400"
                  />
                  Avoid Clich&eacute;s
                </label>
                <div></div>
              </div>
            </div>

            <div class="mt-5">
              <button
                id="generateButton"
                type="button"
                class="inline-flex w-full items-center justify-center rounded-2xl bg-cyan-500 px-5 py-3 text-base font-semibold text-slate-950 transition hover:bg-cyan-400 disabled:cursor-not-allowed disabled:bg-slate-700 disabled:text-slate-300"
              >
                Generate &amp; Compare
              </button>
            </div>
          </div>
        </div>
      </section>

      <section id="liveSection" class="mt-6 rounded-3xl border border-line bg-panel p-5 sm:p-6">
        <div class="mb-4 rounded-2xl border border-line bg-panelSoft p-4">
          <p class="mb-2 text-[11px] font-semibold uppercase tracking-[0.2em] text-slate-400">Quick Inputs</p>
          <div class="overflow-x-auto">
            <div class="flex min-w-max items-end gap-2">
              <label class="block">
                <span class="mb-1 block text-[11px] text-slate-400">Theme</span>
                <input
                  id="quickThemeName"
                  type="text"
                  class="w-48 rounded-lg border border-line bg-slate-950 px-2.5 py-1.5 text-xs text-white outline-none transition focus:border-accent"
                />
              </label>
              <label class="block">
                <span class="mb-1 block text-[11px] text-slate-400">Keywords</span>
                <input
                  id="quickKeywords"
                  type="text"
                  class="w-72 rounded-lg border border-line bg-slate-950 px-2.5 py-1.5 text-xs text-white outline-none transition focus:border-accent"
                />
              </label>
              <label class="block">
                <span class="mb-1 block text-[11px] text-slate-400">Funny%</span>
                <input
                  id="quickFunnyPct"
                  type="number"
                  min="0"
                  max="100"
                  class="w-20 rounded-lg border border-line bg-slate-950 px-2.5 py-1.5 text-xs text-white outline-none transition focus:border-accent"
                />
              </label>
              <label class="block">
                <span class="mb-1 block text-[11px] text-slate-400">Emotion%</span>
                <input
                  id="quickEmotionPct"
                  type="number"
                  min="0"
                  max="100"
                  class="w-20 rounded-lg border border-line bg-slate-950 px-2.5 py-1.5 text-xs text-white outline-none transition focus:border-accent"
                />
              </label>
              <label class="block">
                <span class="mb-1 block text-[11px] text-slate-400">Visual</span>
                <input
                  id="quickVisualStyle"
                  type="text"
                  class="w-44 rounded-lg border border-line bg-slate-950 px-2.5 py-1.5 text-xs text-white outline-none transition focus:border-accent"
                />
              </label>
              <label class="block">
                <span class="mb-1 block text-[11px] text-slate-400">Count</span>
                <input
                  id="quickCount"
                  type="number"
                  min="1"
                  class="w-16 rounded-lg border border-line bg-slate-950 px-2.5 py-1.5 text-xs text-white outline-none transition focus:border-accent"
                />
              </label>
              <label class="block">
                <span class="mb-1 block text-[11px] text-slate-400">Max Words</span>
                <input
                  id="quickMaxWords"
                  type="number"
                  min="1"
                  class="w-20 rounded-lg border border-line bg-slate-950 px-2.5 py-1.5 text-xs text-white outline-none transition focus:border-accent"
                />
              </label>
              <label class="block">
                <span class="mb-1 block text-[11px] text-slate-400">Audience</span>
                <input
                  id="quickAudience"
                  type="text"
                  class="w-44 rounded-lg border border-line bg-slate-950 px-2.5 py-1.5 text-xs text-white outline-none transition focus:border-accent"
                />
              </label>
            </div>
          </div>
        </div>

        <div id="statusSection" class="hidden rounded-2xl border border-line bg-panelSoft px-4 py-3">
          <div class="flex items-center gap-3">
            <div
              id="spinner"
              class="h-4 w-4 animate-spin rounded-full border-2 border-slate-600 border-t-cyan-400"
            ></div>
            <p id="statusText" class="text-sm text-slate-200">Preparing request...</p>
          </div>
        </div>

        <div id="errorBanner" class="mt-4 hidden rounded-2xl border border-danger/50 bg-danger/10 px-4 py-3 text-sm text-red-100"></div>

        <div id="resultsSection" class="mt-4 hidden">
          <div id="winnerBanner" class="mb-4 rounded-2xl border border-amber-300/40 bg-amber-300/20 px-4 py-3 text-sm font-semibold text-amber-100"></div>

          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-line text-left text-sm">
              <thead class="text-slate-300">
                <tr>
                  <th class="px-3 py-3 font-medium">Model</th>
                  <th class="px-3 py-3 font-medium">Backend</th>
                  <th class="px-3 py-3 font-medium">Status</th>
                  <th class="px-3 py-3 font-medium">Score</th>
                  <th class="px-3 py-3 font-medium">Time</th>
                  <th class="px-3 py-3 font-medium">Phrases</th>
                </tr>
              </thead>
              <tbody id="resultsBody" class="divide-y divide-line"></tbody>
            </table>
          </div>

          <div class="mt-4 grid gap-2 text-sm text-slate-200 sm:grid-cols-3">
            <p id="winnerSummary">🏆 Winner: -</p>
            <p id="fastestSummary">⚡ Fastest: -</p>
            <p id="totalSummary">⏱ Total: -</p>
          </div>
        </div>
      </section>

      <section id="historySection" class="mt-6 rounded-3xl border border-line bg-panel p-5 sm:p-6">
        <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <h2 class="text-xl font-semibold text-white">Recent Runs</h2>
          <button
            id="refreshHistoryButton"
            type="button"
            class="rounded-xl border border-line px-4 py-2 text-sm font-medium text-slate-200 transition hover:border-cyan-400 hover:text-white"
          >
            Refresh
          </button>
        </div>

        <p id="historyMessage" class="mt-4 text-sm text-slate-400">Loading history...</p>
        <div id="historyList" class="mt-4 space-y-3"></div>

        <div class="mt-4">
          <button
            id="loadMoreButton"
            type="button"
            class="hidden rounded-xl border border-line px-4 py-2 text-sm font-medium text-slate-200 transition hover:border-cyan-400 hover:text-white"
          >
            Load more
          </button>
        </div>
      </section>
    </main>

    <script>
      const API_URL = "/generation/compare-models";
      const HISTORY_URL = "/generation/compare-results";
      const FETCH_TIMEOUT_MS = 400000;
      const STATUS_STEPS = [
        "Calling groq (llama-3.3-70b)...",
        "Calling ollama (qwen2.5:7b)...",
        "Calling ollama (llama3.1:8b)...",
        "Calling ollama (mistral:7b)...",
      ];

      const generateButton = document.getElementById("generateButton");
      const populateFieldsButton = document.getElementById("populateFieldsButton");
      const importStatus = document.getElementById("importStatus");
      const jsonImportInput = document.getElementById("jsonImportInput");

      const themeNameInput = document.getElementById("themeName");
      const keywordsInput = document.getElementById("keywords");
      const funnyPctInput = document.getElementById("funnyPct");
      const emotionPctInput = document.getElementById("emotionPct");
      const visualStyleInput = document.getElementById("visualStyle");
      const audienceInput = document.getElementById("audience");
      const countInput = document.getElementById("count");
      const maxWordsInput = document.getElementById("maxWords");
      const emojiPolicyInput = document.getElementById("emojiPolicy");
      const toneStyleInput = document.getElementById("toneStyle");
      const avoidClichesInput = document.getElementById("avoidCliches");

      const quickThemeNameInput = document.getElementById("quickThemeName");
      const quickKeywordsInput = document.getElementById("quickKeywords");
      const quickFunnyPctInput = document.getElementById("quickFunnyPct");
      const quickEmotionPctInput = document.getElementById("quickEmotionPct");
      const quickVisualStyleInput = document.getElementById("quickVisualStyle");
      const quickCountInput = document.getElementById("quickCount");
      const quickMaxWordsInput = document.getElementById("quickMaxWords");
      const quickAudienceInput = document.getElementById("quickAudience");

      const statusSection = document.getElementById("statusSection");
      const statusText = document.getElementById("statusText");
      const spinner = document.getElementById("spinner");
      const errorBanner = document.getElementById("errorBanner");
      const resultsSection = document.getElementById("resultsSection");
      const winnerBanner = document.getElementById("winnerBanner");
      const resultsBody = document.getElementById("resultsBody");
      const winnerSummary = document.getElementById("winnerSummary");
      const fastestSummary = document.getElementById("fastestSummary");
      const totalSummary = document.getElementById("totalSummary");

      const refreshHistoryButton = document.getElementById("refreshHistoryButton");
      const historyMessage = document.getElementById("historyMessage");
      const historyList = document.getElementById("historyList");
      const loadMoreButton = document.getElementById("loadMoreButton");

      let statusTimerIds = [];
      let historyOffset = 0;
      let historyLoading = false;
      let historyHasMore = true;
      const historyRuns = [];
      const expandedRunIds = new Set();

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function stripLeadingListMarker(value) {
        return String(value || "")
          .trim()
          .replace(/^(?:\d+\s*[\.\)\-:]\s*)+/, "")
          .trim();
      }

      function parseJsonList(value) {
        if (Array.isArray(value)) {
          return value.map((item) => String(item));
        }
        if (typeof value !== "string") {
          return [];
        }
        try {
          const parsed = JSON.parse(value);
          return Array.isArray(parsed) ? parsed.map((item) => String(item)) : [];
        } catch (error) {
          return [];
        }
      }

      function formatDuration(ms) {
        const value = Math.max(0, Number(ms) || 0);
        if (value < 1000) {
          return `${value}ms`;
        }
        const seconds = Math.floor(value / 1000);
        const remainderMs = value % 1000;
        if (seconds < 60) {
          return `${seconds}s ${remainderMs}ms`;
        }
        const minutes = Math.floor(seconds / 60);
        const remSeconds = seconds % 60;
        return `${minutes}m ${remSeconds}s ${remainderMs}ms`;
      }

      function toApiEmojiPolicy(value) {
        const mapping = {
          none: "none",
          allowed: "light",
          required: "expressive",
          light: "light",
          expressive: "expressive",
        };
        return mapping[String(value || "none").toLowerCase()] || "none";
      }

      function toApiToneStyle(value) {
        const mapping = {
          conversational: "conversational",
          poetic: "poetic",
          formal: "minimal",
          playful: "witty",
          minimal: "minimal",
          witty: "witty",
          inspirational: "inspirational",
        };
        return mapping[String(value || "conversational").toLowerCase()] || "conversational";
      }

      function setEmojiPolicySelect(value) {
        const normalized = String(value || "").toLowerCase();
        const mapping = {
          none: "none",
          light: "allowed",
          expressive: "required",
          allowed: "allowed",
          required: "required",
        };
        const next = mapping[normalized];
        if (next) {
          emojiPolicyInput.value = next;
        }
      }

      function setToneStyleSelect(value) {
        const normalized = String(value || "").toLowerCase();
        const mapping = {
          conversational: "conversational",
          poetic: "poetic",
          minimal: "formal",
          formal: "formal",
          witty: "playful",
          playful: "playful",
          inspirational: "playful",
        };
        const next = mapping[normalized];
        if (next) {
          toneStyleInput.value = next;
        }
      }

      function buildPayload() {
        return {
          theme_name: themeNameInput.value.trim(),
          tone_funny_pct: Number(funnyPctInput.value || 0),
          tone_emotion_pct: Number(emotionPctInput.value || 0),
          prompt_keywords: keywordsInput.value
            .split(",")
            .map((item) => item.trim())
            .filter(Boolean),
          visual_style: visualStyleInput.value.trim(),
          audience: audienceInput.value.trim() || "general",
          count: Number(countInput.value || 3),
          max_words: Number(maxWordsInput.value || 16),
          emoji_policy: toApiEmojiPolicy(emojiPolicyInput.value),
          tone_style: toApiToneStyle(toneStyleInput.value),
          avoid_cliches: Boolean(avoidClichesInput.checked),
          style_anchor_enabled: true,
        };
      }

      function setImportStatus(text, type) {
        importStatus.textContent = text;
        importStatus.className = "mt-2 text-sm";
        if (type === "success") {
          importStatus.classList.add("text-emerald-300");
        } else if (type === "error") {
          importStatus.classList.add("text-red-300");
        } else {
          importStatus.classList.add("text-slate-400");
        }
      }

      function populateFieldsFromJson(raw) {
        if (Object.prototype.hasOwnProperty.call(raw, "theme_name")) {
          themeNameInput.value = String(raw.theme_name ?? "");
        }
        if (Object.prototype.hasOwnProperty.call(raw, "tone_funny_pct")) {
          funnyPctInput.value = String(raw.tone_funny_pct ?? "");
        }
        if (Object.prototype.hasOwnProperty.call(raw, "tone_emotion_pct")) {
          emotionPctInput.value = String(raw.tone_emotion_pct ?? "");
        }
        if (Object.prototype.hasOwnProperty.call(raw, "prompt_keywords")) {
          const keywords = raw.prompt_keywords;
          keywordsInput.value = Array.isArray(keywords)
            ? keywords.map((item) => String(item).trim()).filter(Boolean).join(", ")
            : String(keywords ?? "");
        }
        if (Object.prototype.hasOwnProperty.call(raw, "visual_style")) {
          visualStyleInput.value = String(raw.visual_style ?? "");
        }
        if (Object.prototype.hasOwnProperty.call(raw, "audience")) {
          audienceInput.value = String(raw.audience ?? "");
        }
        if (Object.prototype.hasOwnProperty.call(raw, "count")) {
          countInput.value = String(raw.count ?? "");
        }
        if (Object.prototype.hasOwnProperty.call(raw, "max_words")) {
          maxWordsInput.value = String(raw.max_words ?? "");
        }
        if (Object.prototype.hasOwnProperty.call(raw, "emoji_policy")) {
          setEmojiPolicySelect(raw.emoji_policy);
        }
        if (Object.prototype.hasOwnProperty.call(raw, "tone_style")) {
          setToneStyleSelect(raw.tone_style);
        }
        if (Object.prototype.hasOwnProperty.call(raw, "avoid_cliches")) {
          avoidClichesInput.checked = Boolean(raw.avoid_cliches);
        }
      }

      function bindMirroredInputs(mainInput, quickInput, eventName = "input") {
        if (!mainInput || !quickInput) {
          return;
        }

        mainInput.addEventListener(eventName, () => {
          quickInput.value = mainInput.value;
        });

        quickInput.addEventListener(eventName, () => {
          mainInput.value = quickInput.value;
        });
      }

      function syncQuickInputsFromMain() {
        quickThemeNameInput.value = themeNameInput.value;
        quickKeywordsInput.value = keywordsInput.value;
        quickFunnyPctInput.value = funnyPctInput.value;
        quickEmotionPctInput.value = emotionPctInput.value;
        quickVisualStyleInput.value = visualStyleInput.value;
        quickCountInput.value = countInput.value;
        quickMaxWordsInput.value = maxWordsInput.value;
        quickAudienceInput.value = audienceInput.value;
      }

      function clearStatusTimers() {
        statusTimerIds.forEach((id) => window.clearTimeout(id));
        statusTimerIds = [];
      }

      function setStatus(message, done = false) {
        statusText.textContent = message;
        spinner.classList.toggle("hidden", done);
      }

      function scheduleStatusProgress() {
        clearStatusTimers();
        STATUS_STEPS.forEach((label, index) => {
          const id = window.setTimeout(() => {
            setStatus(label, false);
          }, index * 1800);
          statusTimerIds.push(id);
        });
      }

      function fetchWithTimeout(url, options, timeoutMs) {
        const controller = new AbortController();
        const timerId = window.setTimeout(() => controller.abort(), timeoutMs);

        return fetch(url, { ...options, signal: controller.signal }).finally(() => {
          window.clearTimeout(timerId);
        });
      }

      function resolveScore(result) {
        if (result && typeof result.score === "number" && Number.isFinite(result.score)) {
          return result.score;
        }
        return null;
      }

      function buildResultRows(results, winnerModel) {
        const successful = results.filter((result) => result.success && Number(result.latency_ms) > 0);
        const fastestLatency = successful.length ? Math.min(...successful.map((item) => Number(item.latency_ms))) : 0;
        const winnerResult = results.find((result) => result.model === winnerModel || result.model_name === winnerModel);
        const winnerLatency = winnerResult && Number(winnerResult.latency_ms) > 0 ? Number(winnerResult.latency_ms) : fastestLatency;

        return results
          .map((result) => {
            const modelName = String(result.model_name || result.model || "-");
            const backend = String(result.backend || "-");
            const isWinner = Boolean(winnerModel && modelName === winnerModel);
            const scoreValue = resolveScore(result);
            const latency = Number(result.latency_ms || 0);
            const isSuccess = Boolean(result.success);
            const hasConstraintIssues = Boolean(result.constraint_issues);
            const phrases = parseJsonList(result.phrases);
            const errorText = result.error || result.error_message || null;

            let barWidth = 8;
            let barColor = "bg-red-400";
            if (isSuccess) {
              barColor = isWinner ? "bg-emerald-400" : "bg-cyan-400";
              if (latency > 0 && winnerLatency > 0) {
                barWidth = isWinner ? 100 : Math.max(10, Math.min(100, Math.round((winnerLatency / latency) * 100)));
              } else {
                barWidth = isWinner ? 100 : 30;
              }
            }

            const statusBadge = isSuccess
              ? '<span class="inline-flex rounded-full bg-emerald-500/15 px-2 py-1 text-xs font-semibold text-emerald-300">✓ Success</span>'
              : '<span class="inline-flex rounded-full bg-red-500/15 px-2 py-1 text-xs font-semibold text-red-300">✗ Failed</span>';

            const phrasesHtml = phrases.length
              ? `<ol class="list-decimal space-y-1 pl-5">${phrases
                  .map((phrase) => `<li class="leading-6 text-slate-200">${escapeHtml(stripLeadingListMarker(phrase))}</li>`)
                  .join("")}</ol>`
              : `<p class="text-xs text-slate-400">${escapeHtml(errorText || "No phrases")}</p>`;

            return `
              <tr class="align-top">
                <td class="px-3 py-3">
                  <p class="font-semibold text-white">${escapeHtml(modelName)}</p>
                  <div class="mt-2 flex flex-wrap gap-1">
                    <span class="inline-flex rounded-full border border-cyan-500/30 bg-cyan-500/10 px-2 py-0.5 text-[11px] text-cyan-200">${escapeHtml(
                      backend
                    )}</span>
                  </div>
                </td>
                <td class="px-3 py-3 text-slate-300">${escapeHtml(backend)}</td>
                <td class="px-3 py-3">
                  ${statusBadge}
                  ${hasConstraintIssues ? '<p class="mt-2 text-xs text-amber-300">constraint issues</p>' : ""}
                </td>
                <td class="px-3 py-3 ${isWinner ? "font-semibold text-emerald-300" : "text-slate-200"}">
                  ${scoreValue !== null ? escapeHtml(scoreValue.toFixed(2)) : "-"}
                </td>
                <td class="px-3 py-3 text-slate-200">
                  <p>${latency > 0 ? escapeHtml(formatDuration(latency)) : "-"}</p>
                  <div class="mt-2 h-2 w-full rounded-full bg-slate-800">
                    <div class="h-2 rounded-full ${barColor}" style="width: ${barWidth}%"></div>
                  </div>
                </td>
                <td class="px-3 py-3">${phrasesHtml}</td>
              </tr>
            `;
          })
          .join("");
      }

      function renderLiveResults(payload) {
        const results = Array.isArray(payload.results) ? payload.results : [];
        const winnerModel = payload.winner && payload.winner.model ? payload.winner.model : null;

        if (winnerModel) {
          winnerBanner.textContent = `🏆 Winner: ${winnerModel} (score: ${Number(payload.winner.score || 0).toFixed(2)})`;
        } else {
          winnerBanner.textContent = "🏆 Winner: No successful backend";
        }

        resultsBody.innerHTML = buildResultRows(results, winnerModel);

        const successful = results.filter((item) => item.success && Number(item.latency_ms) > 0);
        const fastest = successful.length
          ? successful.reduce((minItem, current) =>
              Number(current.latency_ms) < Number(minItem.latency_ms) ? current : minItem
            )
          : null;

        winnerSummary.textContent = `🏆 Winner: ${winnerModel || "-"}`;
        fastestSummary.textContent = `⚡ Fastest: ${fastest ? fastest.model || fastest.model_name : "-"}`;
        totalSummary.textContent = `⏱ Total: ${formatDuration(payload.total_time_ms || 0)}`;
        resultsSection.classList.remove("hidden");
      }

      function formatRunDate(value) {
        if (!value) {
          return "Unknown date";
        }
        const parsed = new Date(value);
        if (Number.isNaN(parsed.getTime())) {
          return String(value);
        }
        return parsed.toLocaleString();
      }

      function normalizeHistoryRun(run) {
        const results = Array.isArray(run.results)
          ? run.results.map((result) => ({
              ...result,
              model: result.model_name,
              phrases: Array.isArray(result.phrases) ? result.phrases : parseJsonList(result.phrases),
              error: result.error || result.error_message || null,
            }))
          : [];

        return {
          ...run,
          prompt_keywords: Array.isArray(run.prompt_keywords)
            ? run.prompt_keywords
            : parseJsonList(run.prompt_keywords),
          winner_phrases: Array.isArray(run.winner_phrases)
            ? run.winner_phrases
            : parseJsonList(run.winner_phrases),
          results,
        };
      }

      function renderHistory() {
        if (!historyRuns.length) {
          historyMessage.textContent = "No runs found.";
          historyList.innerHTML = "";
          loadMoreButton.classList.add("hidden");
          return;
        }

        historyMessage.textContent = "";
        historyList.innerHTML = historyRuns
          .map((rawRun) => {
            const run = normalizeHistoryRun(rawRun);
            const isExpanded = expandedRunIds.has(run.run_id);
            const winnerModel = run.winner_model || null;
            const winnerScore =
              typeof run.winner_score === "number" && Number.isFinite(run.winner_score)
                ? run.winner_score.toFixed(2)
                : "-";
            const details = isExpanded
              ? `
                <div class="mt-4 rounded-2xl border border-line bg-slate-950/60 p-4">
                  <div class="mb-3 rounded-xl border border-amber-300/40 bg-amber-300/20 px-3 py-2 text-sm font-semibold text-amber-100">
                    🏆 Winner: ${escapeHtml(run.winner_model || "No successful backend")}${
                      run.winner_model && run.winner_score !== null ? ` (score: ${escapeHtml(winnerScore)})` : ""
                    }
                  </div>
                  <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-line text-left text-sm">
                      <thead class="text-slate-300">
                        <tr>
                          <th class="px-3 py-3 font-medium">Model</th>
                          <th class="px-3 py-3 font-medium">Backend</th>
                          <th class="px-3 py-3 font-medium">Status</th>
                          <th class="px-3 py-3 font-medium">Score</th>
                          <th class="px-3 py-3 font-medium">Time</th>
                          <th class="px-3 py-3 font-medium">Phrases</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-line">
                        ${buildResultRows(run.results, winnerModel)}
                      </tbody>
                    </table>
                  </div>
                  <div class="mt-3 grid gap-2 text-sm text-slate-200 sm:grid-cols-3">
                    <p>🏆 Winner: ${escapeHtml(run.winner_model || "-")}</p>
                    <p>⚡ Fastest: ${escapeHtml(
                      (run.results
                        .filter((item) => item.success && Number(item.latency_ms) > 0)
                        .sort((a, b) => Number(a.latency_ms) - Number(b.latency_ms))[0] || {}).model_name || "-"
                    )}</p>
                    <p>⏱ Total: ${escapeHtml(formatDuration(run.total_time_ms || 0))}</p>
                  </div>
                </div>
              `
              : "";

            return `
              <article class="rounded-2xl border border-line bg-panelSoft/50 p-4" data-run-id="${escapeHtml(run.run_id)}">
                <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                  <div>
                    <p class="text-base font-semibold text-white">${escapeHtml(run.theme_name || "-")}</p>
                    <p class="mt-1 text-xs text-slate-400">${escapeHtml(formatRunDate(run.created_at))}</p>
                  </div>
                  <div class="flex items-center gap-2">
                    <p class="rounded-full border border-amber-300/40 bg-amber-300/20 px-2.5 py-1 text-xs font-semibold text-amber-100">
                      🏆 ${escapeHtml(run.winner_model || "-")} ${run.winner_model ? `(${escapeHtml(winnerScore)})` : ""}
                    </p>
                    <button
                      type="button"
                      class="rounded-lg border border-line px-3 py-1.5 text-xs font-medium text-slate-200 transition hover:border-cyan-400 hover:text-white"
                      data-toggle-run
                    >
                      ${isExpanded ? "▲" : "▼"}
                    </button>
                  </div>
                </div>
                ${details}
              </article>
            `;
          })
          .join("");

        loadMoreButton.classList.toggle("hidden", !historyHasMore);
      }

      async function loadHistory({ reset = false } = {}) {
        if (historyLoading) {
          return;
        }

        if (reset) {
          historyOffset = 0;
          historyHasMore = true;
          historyRuns.length = 0;
          expandedRunIds.clear();
          historyList.innerHTML = "";
          historyMessage.textContent = "Loading history...";
        }

        if (!historyHasMore) {
          return;
        }

        historyLoading = true;
        try {
          const response = await fetch(`${HISTORY_URL}?offset=${historyOffset}&limit=10`, {
            headers: { Accept: "application/json" },
          });

          if (!response.ok) {
            throw new Error(`History request failed with status ${response.status}`);
          }

          const runs = await response.json();
          if (!Array.isArray(runs)) {
            throw new Error("Invalid history response payload");
          }

          if (runs.length === 0) {
            historyHasMore = false;
          } else {
            historyRuns.push(...runs);
            historyOffset += runs.length;
            historyHasMore = runs.length === 10;
          }

          renderHistory();
        } catch (error) {
          historyMessage.textContent = "Unable to load comparison history.";
          loadMoreButton.classList.add("hidden");
        } finally {
          historyLoading = false;
        }
      }

      function setGeneratingState(isGenerating) {
        generateButton.disabled = isGenerating;
        generateButton.textContent = isGenerating ? "Generating..." : "Generate & Compare";
      }

      async function generateComparison() {
        errorBanner.classList.add("hidden");
        resultsSection.classList.add("hidden");
        statusSection.classList.remove("hidden");
        setStatus(STATUS_STEPS[0], false);
        scheduleStatusProgress();
        setGeneratingState(true);

        try {
          const payload = buildPayload();
          const response = await fetchWithTimeout(
            API_URL,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            },
            FETCH_TIMEOUT_MS
          );

          if (!response.ok) {
            if (response.status === 503) {
              throw new Error("LLM comparator not running on port 8001.");
            }
            throw new Error(`Request failed with status ${response.status}`);
          }

          const data = await response.json();
          clearStatusTimers();
          setStatus("All backends complete.", true);
          renderLiveResults(data);
          await loadHistory({ reset: true });
        } catch (error) {
          clearStatusTimers();
          setStatus("Unable to complete comparison.", true);
          errorBanner.textContent = error instanceof Error ? error.message : "Unknown error";
          errorBanner.classList.remove("hidden");
        } finally {
          setGeneratingState(false);
        }
      }

      populateFieldsButton.addEventListener("click", () => {
        try {
          const parsed = JSON.parse(jsonImportInput.value.trim());
          if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
            throw new Error("Invalid JSON");
          }
          populateFieldsFromJson(parsed);
          syncQuickInputsFromMain();
          setImportStatus("✓ Populated", "success");
        } catch (error) {
          setImportStatus("✗ Invalid JSON", "error");
        }
      });

      bindMirroredInputs(themeNameInput, quickThemeNameInput);
      bindMirroredInputs(keywordsInput, quickKeywordsInput);
      bindMirroredInputs(funnyPctInput, quickFunnyPctInput);
      bindMirroredInputs(emotionPctInput, quickEmotionPctInput);
      bindMirroredInputs(visualStyleInput, quickVisualStyleInput);
      bindMirroredInputs(countInput, quickCountInput);
      bindMirroredInputs(maxWordsInput, quickMaxWordsInput);
      bindMirroredInputs(audienceInput, quickAudienceInput);

      generateButton.addEventListener("click", generateComparison);

      historyList.addEventListener("click", (event) => {
        const toggleButton = event.target.closest("[data-toggle-run]");
        if (!toggleButton) {
          return;
        }
        const card = toggleButton.closest("[data-run-id]");
        if (!card) {
          return;
        }
        const runId = card.getAttribute("data-run-id");
        if (!runId) {
          return;
        }

        if (expandedRunIds.has(runId)) {
          expandedRunIds.delete(runId);
        } else {
          expandedRunIds.add(runId);
        }
        renderHistory();
      });

      refreshHistoryButton.addEventListener("click", async () => {
        await loadHistory({ reset: true });
      });

      loadMoreButton.addEventListener("click", async () => {
        await loadHistory({ reset: false });
      });

      syncQuickInputsFromMain();
      loadHistory({ reset: true });
    </script>
  </body>
</html>
